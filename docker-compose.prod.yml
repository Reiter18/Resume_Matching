x-backend: &backend
  build: ./backend
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: jobmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    <<: *backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "alembic upgrade head && python -m app.cli seed-skills && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request as u; assert json.load(u.urlopen('http://localhost:8000/health', timeout=3))['status']=='ok'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  worker:
    <<: *backend
    depends_on:
      api: { condition: service_healthy }
    command: celery -A app.celery_app worker -Q ingest,default -l info
  beat:
    <<: *backend
    depends_on:
      api: { condition: service_healthy }
    command: celery -A app.celery_app beat -l info -s /tmp/celerybeat-schedule
  web:
    build: { context: ./frontend, target: prod }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["80:80"]
volumes:
  pgdata:
